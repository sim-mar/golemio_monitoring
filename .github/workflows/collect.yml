name: Collect waste data

on:
  schedule:
    # Každou hodinu 07:00–00:00 CEST (= 05:00–22:00 UTC) + 04:00 CEST (= 02:00 UTC)
    # Účel: zjistit přesné časy měření senzorů
    - cron: '0 2  * * *'   # 04:00 CEST (noční kontrola)
    - cron: '0 5  * * *'   # 07:00 CEST
    - cron: '0 6  * * *'   # 08:00 CEST
    - cron: '0 7  * * *'   # 09:00 CEST
    - cron: '0 8  * * *'   # 10:00 CEST
    - cron: '0 9  * * *'   # 11:00 CEST
    - cron: '0 10 * * *'   # 12:00 CEST
    - cron: '0 11 * * *'   # 13:00 CEST
    - cron: '0 12 * * *'   # 14:00 CEST
    - cron: '0 13 * * *'   # 15:00 CEST
    - cron: '0 14 * * *'   # 16:00 CEST
    - cron: '0 15 * * *'   # 17:00 CEST
    - cron: '0 16 * * *'   # 18:00 CEST
    - cron: '0 17 * * *'   # 19:00 CEST
    - cron: '0 18 * * *'   # 20:00 CEST
    - cron: '0 19 * * *'   # 21:00 CEST
    - cron: '0 20 * * *'   # 22:00 CEST
    - cron: '0 21 * * *'   # 23:00 CEST
    - cron: '0 22 * * *'   # 00:00 CEST
  workflow_dispatch:  # možnost spustit ručně

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect data & build HTML
        env:
          GOLEMIO_TOKEN: ${{ secrets.GOLEMIO_TOKEN }}
        run: python collect_data.py

      - name: Commit & push if CSV changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kasparovo_namesti_odpady.csv
          if git diff --staged --quiet; then
            echo "Žádná nová data, přeskakuji commit."
          else
            git add index.html
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
